<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

        <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Inter Font (Weights 300, 400, 500, 600, 700) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>EdgeTracker</title>
</head>

<body>

     <!-- ======================================================================= -->
    <!-- OFFER & BIO SECTION                                                            -->
    <!-- ======================================================================= -->
     <div class="top-section">
        <div class="hamburger-menu">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="EdgeTracker-logo">
            <img src="LogoIcon Main.png" alt="EdgeTracker Logo">
        </div>

        <div class="card-status">
            <span class="dot-online"></span>
            <span class="status-text">Live</span>
        </div>

        <div class="notification-bell">
            <i class="fa-solid fa-bell"></i>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="" class="nav-btn">
                <i class="fa-solid fa-house"></i>
                <p class="nav-text">Home</p>
            </a></li>

            <li><a href="" class="nav-btn">
                <i class="fa-solid fa-book-journal-whills"></i>
                <p class="nav-text">Journal</p>
            </a></li>

            <li><a href="" class="create-btn">
                <i class="fa-solid fa-plus"></i>
            </a></li>

            <li><a href="" class="nav-btn">
                <i class="fa-solid fa-chart-line"></i>
                <p class="nav-text">Insights</p>
            </a></li>

            <li><a href="" class="nav-btn">
                <i class="fa-solid fa-chart-simple"></i>
                <p class="nav-text">Stats</p>
            </a></li>
        </ul>
    </nav>

    
</body>
</html>
